name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default: the build job runs repo code (including PR code), so it must
# never hold a token that can push. Only bump-version and release opt into writes.
permissions:
  contents: read

env:
  # Paths the npm tarball never contains. The changes job and bump-version's guard share it, so
  # "shipped" means the same thing to both.
  UNSHIPPED_PATHS: '^(\.github/|docs/|scripts/|README\.md$|LICENSE$|DECISIONS\.md$)'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Floor is Node 22 (pnpm 11 requires >=22.12); 24 is current.
        node-version: ['22.13', '24']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Build/test execute repo code; never leave credentials behind.
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `check` builds the cores first (the plugin typechecks against their dist types),
      # then typechecks + tests every package, and lints the repo last.
      - name: Check
        run: pnpm check

      # The real publish gate: `npm pack` runs prepack, so this proves the exact tarball
      # (plugin bundle + packed .streamDeckPlugin + the `jetstream` bin) still builds on
      # every PR — instead of discovering it only when a release tries to publish (a class of
      # bug where a broken prepack silently ships nothing while versions keep bumping).
      - name: Pack the npm tarball (proves prepack)
        run: npm pack --dry-run
        working-directory: packages/jetstream

      # Both shipped artifacts are gitignored and reach the tarball only through `files`, so
      # assert they are in it, then run the bin the way a user would. --version is answered by the
      # package itself (--help forwards to the installed plugin, which a runner does not have).
      - name: Assert the tarball contents and run the bin
        working-directory: packages/jetstream
        run: |
          # prepack's own log lines go to stdout, so list the (already built) contents separately.
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pack.json"
          for f in dist/npm-cli-entry.js assets/gg.pim.jetstream.streamDeckPlugin; do
            jq -e --arg f "$f" '.[0].files | map(.path) | index($f)' "$RUNNER_TEMP/pack.json" > /dev/null \
              || { echo "::error::$f is missing from the npm tarball"; exit 1; }
          done
          expected="@pimmesz/jetstream $(jq -r .version package.json)"
          actual="$(node dist/npm-cli-entry.js --version | head -n 1)"
          case "$actual" in
            "$expected"*) echo "bin ok: $actual" ;;
            *) echo "::error::bin printed '$actual', expected it to start with '$expected'"; exit 1 ;;
          esac

      # The esbuild bundles users run (prepack built them above): the plugin CLI must load and answer
      # --help, and each hook that does nothing on empty stdin must load and exit 0. plugin.js and
      # hooks-install.js are left out: they talk to Stream Deck or write the user's settings.
      - name: Load the plugin CLI and hook bundles
        working-directory: packages/jetstream/gg.pim.jetstream.sdPlugin/bin
        run: |
          help="$(node jetstream.js --help)" || { echo "::error::bin/jetstream.js --help exited non-zero"; exit 1; }
          case "$help" in
            jetstream*) echo "plugin CLI ok: $(head -n 1 <<< "$help")" ;;
            *) echo "::error::bin/jetstream.js --help printed '$(head -n 1 <<< "$help")', expected it to start with 'jetstream'"; exit 1 ;;
          esac
          for hook in status-hook permission-hook stop-gate usage-hook; do
            node "${hook}.js" < /dev/null > /dev/null \
              || { echo "::error::bin/${hook}.js failed on empty stdin"; exit 1; }
          done

  changes:
    name: Detect published-file changes
    # Only the release path cares; PRs never bump.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      shipped: ${{ steps.detect.outputs.shipped }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Need history on both sides of the push to diff its range.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect whether any published file changed
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # The tarball is built from packages/** (the plugin bundle inlines all four
          # packages), so any change there is shippable. Absent from it: .github/ (CI),
          # top-level docs, docs/ (the landing page), scripts/ (the landing renderer), and
          # DECISIONS.md (the design-decision log, which `npm pack` does not include)
          # — a landing-page or decision-log edit must not cut an npm release of an
          # identical tarball.
          # Fail safe toward publishing: an unknown base (first push / rewritten
          # history) => shipped.
          if ! git rev-parse --verify --quiet "${BEFORE}^{commit}" >/dev/null; then
            echo "base ${BEFORE} unavailable; treating as a shippable change"
            echo "shipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames on purpose: with rename detection a file MOVED out of packages/ into an
          # excluded path (docs/, scripts/) is reported only as its new name, so the package losing
          # a file would read as a docs-only change and skip the release. Splitting a rename into
          # delete+add emits both paths, which can only ever widen what counts as shippable.
          files="$(git diff --no-renames --name-only "${BEFORE}" "${AFTER}")"
          echo "changed files in push range:"
          echo "${files:-<none>}"
          if [ -z "${files}" ]; then
            echo "no file delta — nothing to publish"
            echo "shipped=false" >> "$GITHUB_OUTPUT"
          elif grep -qvE "${UNSHIPPED_PATHS}" <<< "${files}"; then
            echo "a published file changed — release will proceed"
            echo "shipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "only CI/docs changed — skipping release"
            echo "shipped=false" >> "$GITHUB_OUTPUT"
          fi

  bump-version:
    name: Auto-bump version
    needs: [build, changes]
    outputs:
      skip: ${{ steps.guard.outputs.skip || steps.commit.outputs.skip }}
      version: ${{ steps.bump.outputs.version }}
      commit: ${{ steps.commit.outputs.sha }}
    # The only job that may push; the workflow default is contents: read.
    permissions:
      contents: write
    # Serialized so merges never race each other's push. GitHub cancels a pending run for a newer one,
    # which releases the cancelled run's commits too when its own push changed a shipped file.
    concurrency:
      group: bump-version-main
      cancel-in-progress: false
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.shipped == 'true' &&
      !startsWith(github.event.head_commit.message, 'chore(release): bump version')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # main's tip, so the version builds on any bump already pushed; the guard below skips
          # the release when that tip holds shipped changes this run's build never tested.
          ref: main
          # Full history: the guard reads past the tested commit, the bump back to the last release.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Release only what this run's build tested. When main gained shipped changes after this push
      # (the bot's own commits aside), the newer push's run, whose build saw them, releases instead.
      - name: Skip when main moved past the tested commit
        id: guard
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "main no longer contains ${GITHUB_SHA}; the run for main's tip releases"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          untested=""
          for sha in $(git rev-list --no-merges "${GITHUB_SHA}..HEAD"); do
            subject="$(git show -s --format=%s "$sha")"
            case "$subject" in
              'chore(release): bump version'* | 'docs: sync landing page'*) continue ;;
            esac
            files="$(git diff-tree --no-commit-id --no-renames --name-only -r "$sha")"
            if [ -n "$files" ] && grep -qvE "$UNSHIPPED_PATHS" <<< "$files"; then
              untested+="${sha:0:7} ${subject}"$'\n'
            fi
          done
          if [ -n "$untested" ]; then
            echo "main has shipped changes this run's build did not test; the newer push's run releases them:"
            printf '%s' "$untested"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump package version
        id: bump
        if: steps.guard.outputs.skip != 'true'
        env:
          # Fallback only, when history gives no shipped commit since a last bump: every commit in the
          # push (a merge tip's subject matches no type), then head_commit, as GitHub truncates past 2048.
          COMMIT_MESSAGES: ${{ toJSON(github.event.commits.*.message) }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          node --input-type=module <<'EOF'
          import { execFileSync } from 'node:child_process';
          import { readFile, writeFile } from 'node:fs/promises';

          // The level comes from every commit since the last bump that touches a shipped path: a
          // cancelled or skipped run leaves its feat or `!` to this one, a docs-only feat raises nothing.
          // A merge counts by what it brought to main (its first-parent diff), so a `feat!` merge
          // subject over `fix` children still raises a major.
          const git = (args) => execFileSync('git', args, { encoding: 'utf8' });
          const unshipped = new RegExp(process.env.UNSHIPPED_PATHS);
          const touchesShipped = (sha) =>
            git(['diff-tree', '--no-commit-id', '--no-renames', '--name-only', '-r', '--diff-merges=first-parent', sha])
              .split('\n')
              .some((path) => path !== '' && !unshipped.test(path));
          const lastBump = git(['log', '-1', '--format=%H', '--grep=^chore(release): bump version', 'HEAD']).trim();
          let messages = lastBump
            ? git(['rev-list', `${lastBump}..HEAD`])
                .split('\n')
                .filter((sha) => sha !== '' && touchesShipped(sha))
                .map((sha) => git(['show', '-s', '--format=%B', sha]).trim())
            : [];
          if (messages.length === 0) {
            try {
              messages = JSON.parse(process.env.COMMIT_MESSAGES ?? '[]');
            } catch {
              messages = [];
            }
          }
          if (!Array.isArray(messages) || messages.length === 0) {
            messages = [process.env.HEAD_COMMIT_MESSAGE ?? ''];
          }
          // The bot's own bump commits carry [skip ci], but filter them out
          // defensively so a mixed push can't misread them.
          messages = messages.filter(
            (m) => typeof m === 'string' && !/^chore\(release\): bump version/.test(m),
          );

          // The same two signs the release notes list under Breaking changes: a line opening with a
          // BREAKING CHANGE (or BREAKING-CHANGE) footer, or a `!` subject.
          const subject = (m) => m.split('\n', 1)[0] ?? '';
          const isMajor = (m) =>
            /^BREAKING[ -]CHANGE:/m.test(m) || /^[a-z]+(?:\([^)]+\))?!:/.test(subject(m));
          const isMinor = (m) => /^feat(?:\([^)]+\))?:/.test(subject(m));

          const pkgPath = 'packages/jetstream/package.json';
          const pkg = JSON.parse(await readFile(pkgPath, 'utf8'));
          // Refuse prereleases and anything non-numeric: "1.2.3-rc.1" would
          // otherwise bump to "1.2.NaN" and push it with [skip ci].
          if (!/^\d+\.\d+\.\d+$/.test(String(pkg.version))) {
            console.error(`refusing to auto-bump non-release version: ${pkg.version}`);
            process.exit(1);
          }
          const [major = 0, minor = 0, patch = 0] = String(pkg.version)
            .split('.')
            .map((part) => Number(part));

          let next;
          if (messages.some(isMajor)) {
            next = `${major + 1}.0.0`;
          } else if (messages.some(isMinor)) {
            next = `${major}.${minor + 1}.0`;
          } else {
            next = `${major}.${minor}.${patch + 1}`;
          }

          pkg.version = next;
          await writeFile(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);

          // The sdPlugin manifest Version must move IN LOCKSTEP, because it is not cosmetic:
          // Stream Deck only upgrades an installed plugin when this number is strictly higher.
          // Leave it behind and the release reaches nobody's deck — the npm package publishes
          // fine, users run `jetstream install`, Stream Deck answers "already installed", and
          // they keep running the old plugin. That is exactly how v2.0.0 shipped to npm and
          // to no hardware. Elgato wants four parts, npm gives three, so append `.0`.
          const manifestPath = 'packages/jetstream/gg.pim.jetstream.sdPlugin/manifest.json';
          const manifestRaw = await readFile(manifestPath, 'utf8');
          // Replace ONLY the version string, rather than round-tripping through
          // JSON.parse/stringify: this is Elgato's schema, edited by their tooling, and a
          // reserialise would silently restructure ~30 lines of it (stringify expands every short
          // array and adds a trailing newline this file does not have). A one-field edit keeps the
          // release diff to the single line that actually changed.
          //
          // The 4-part pattern is load-bearing: the manifest also carries a `"Version": "20"`
          // (an OS minimum), and this must never touch it. Non-global, so only the first match.
          const VERSION_FIELD = /("Version":\s*")\d+\.\d+\.\d+\.\d+(")/;
          if (!VERSION_FIELD.test(manifestRaw)) {
            // Never continue silently: a manifest whose Version does not move is a release that
            // reaches nobody's deck, and the publish looks completely successful.
            console.error(`could not find a 4-part "Version" field in ${manifestPath}`);
            process.exit(1);
          }
          await writeFile(manifestPath, manifestRaw.replace(VERSION_FIELD, `$1${next}.0$2`));

          await writeFile(process.env.GITHUB_OUTPUT, `version=${next}\n`, { flag: 'a' });
          EOF

      # This commit carries [skip ci] and is pushed with GITHUB_TOKEN, so it can never
      # reach sync-landing.yml — re-render here or the landing page's JSON-LD
      # softwareVersion goes stale on every release.
      - name: Re-render the landing page for the new version
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/render-landing.mjs

      - name: Commit version bump
        id: commit
        if: steps.guard.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # Author as the maintainer (not the Actions bot) so automated release commits
          # don't add github-actions[bot] to the repo's contributor list. Still pushed with
          # GITHUB_TOKEN — GitHub attributes a commit by its AUTHOR email, not the pusher.
          git config user.name "Pim Zonneveld"
          git config user.email "pimmesz@users.noreply.github.com"
          git add packages/jetstream/package.json \
                  packages/jetstream/gg.pim.jetstream.sdPlugin/manifest.json \
                  docs/index.html docs/llms.txt
          git commit -m "chore(release): bump version to ${VERSION} [skip ci]"
          # A rejected push rebases over the bots' commits and any commit that touches no shipped path, as no
          # run releases those. A shipped change (a merge by what it brought) would go out untested, so skip.
          for attempt in 1 2 3; do
            if git push; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            for sha in $(git rev-list HEAD..origin/main); do
              subject="$(git show -s --format=%s "$sha")"
              case "$subject" in
                'chore(release): bump version'* | 'docs: sync landing page'*) continue ;;
              esac
              files="$(git diff-tree --no-commit-id --no-renames --name-only -r --diff-merges=first-parent "$sha")"
              if [ -n "$files" ] && grep -qvE "$UNSHIPPED_PATHS" <<< "$files"; then
                echo "::warning::main gained ${sha:0:7} '${subject}' during the release, so this run skips; the next run that changes a shipped file releases these commits."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            git rebase origin/main || {
              git rebase --abort
              echo "::error::the version bump does not rebase onto main's newer commits; re-run this job to bump from main's tip."
              exit 1
            }
          done
          echo "::error::main rejected the version bump push ${attempt} times; check the push log above, then re-run this job."
          exit 1

  publish:
    name: Publish to npm
    needs: bump-version
    if: needs.bump-version.outputs.skip != 'true'
    # OIDC trusted publishing: npmjs.org trusts this workflow's identity directly
    # (configured under the package's Trusted Publisher settings), so no long-lived
    # npm token exists to leak. id-token is the only grant.
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The exact bump commit, not main's tip: a push that lands while this job
          # queues must not ship under this run's version number.
          ref: ${{ needs.bump-version.outputs.commit }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # npm >= 11.5.1 is the floor for OIDC trusted publishing; Node 24 bundles it.
          # No registry-url here: setup-node would write an .npmrc demanding
          # NODE_AUTH_TOKEN, which OIDC deliberately omits.
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepack builds the cores, the plugin bundle, the `jetstream` bin, and packs the
      # .streamDeckPlugin — so the tarball ships exactly this checkout. It is self-contained
      # on purpose: no build step here to fall out of sync with it.
      - name: Publish
        run: npm publish
        working-directory: packages/jetstream

  release:
    name: Tag & GitHub Release
    # publish for ordering (never tag a version that failed to ship); bump-version for
    # the version/commit outputs. The bump commit's [skip ci] and GITHUB_TOKEN push mean
    # no other run ever fires for it, so the tag must be cut here.
    needs: [bump-version, publish]
    if: needs.bump-version.outputs.skip != 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.bump-version.outputs.commit }}
          persist-credentials: false
          # Full history and tags, so the release notes can list the commits since the last tag.
          fetch-depth: 0

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Numeric-only X.Y.Z, enforced by the bump job's regex gate.
          VERSION: ${{ needs.bump-version.outputs.version }}
          TARGET: ${{ needs.bump-version.outputs.commit }}
        run: |
          TAG="v${VERSION}"
          # Idempotent: a re-run of this job after a partial failure must not fail the
          # pipeline on an already-published release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; skipping"
            exit 0
          fi
          # --generate-notes builds from merged PRs, and this repo ships straight from main, so
          # every release body came out empty. List the commits since the previous tag instead.
          PREV="$(git describe --tags --abbrev=0 "${TARGET}^" 2>/dev/null || true)"
          RANGE="${PREV:+${PREV}..}${TARGET}"
          # Each BREAKING CHANGE footer in full, from its line to the next blank one (%n closes a
          # footer that ends its commit), as a list item with its continuation lines indented.
          BREAKING="$(git log --format='%B%n' "$RANGE" | awk '
            on && !NF { on = 0 }
            /^BREAKING[ -]CHANGE:/ { on = 1; sub(/^BREAKING[ -]CHANGE: */, "- "); print; next }
            on { print "  " $0 }')"
          # Every change with its body indented under it, so what the commit explains reaches the
          # release; a `!` subject with no footer still lands under Breaking changes.
          bang='^[a-z]+(\([^)]+\))?!:'
          CHANGES=""
          for sha in $(git rev-list --no-merges "$RANGE"); do
            subject="$(git show -s --format=%s "$sha")"
            case "$subject" in 'chore(release)'*) continue ;; esac
            body="$(git show -s --format=%b "$sha")"
            if [[ "$subject" =~ $bang ]] && ! grep -qE '^BREAKING[ -]CHANGE:' <<< "$body"; then
              BREAKING+="${BREAKING:+$'\n'}- ${subject}"
            fi
            CHANGES+="- ${subject} ($(git show -s --format=%h "$sha"))"$'\n'
            if [ -n "$body" ]; then CHANGES+="$(sed 's/^/  /' <<< "$body")"$'\n'; fi
          done
          {
            if [ -n "$BREAKING" ]; then
              echo '## Breaking changes'
              echo "$BREAKING"
              echo
            fi
            echo '## Changes'
            printf '%s' "$CHANGES"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      # Taken from the published npm tarball, so the marketplace file is the exact build users install
      # and a re-run of this job alone can always fetch it again.
      - name: Fetch the packed plugin from the published tarball
        env:
          VERSION: ${{ needs.bump-version.outputs.version }}
        run: |
          # npm processes a new version for a few minutes before it can be fetched, so keep trying for up to 20.
          for attempt in $(seq 1 40); do
            npm pack "@pimmesz/jetstream@${VERSION}" --ignore-scripts --pack-destination "$RUNNER_TEMP" && break
            if [[ "$attempt" == 40 ]]; then
              echo "::error::npm has no @pimmesz/jetstream@${VERSION} tarball yet; re-run this job once npm view shows it."
              exit 1
            fi
            sleep 30
          done
          tar -xzf "$RUNNER_TEMP/pimmesz-jetstream-${VERSION}.tgz" -C "$RUNNER_TEMP" --strip-components=2 \
            package/assets/gg.pim.jetstream.streamDeckPlugin

      # Its own step, after the idempotent create above, so a re-run still attaches the file.
      # --clobber replaces only an earlier upload of this same published file.
      - name: Attach the packed plugin to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.bump-version.outputs.version }}
        run: |
          gh release upload "v${VERSION}" "$RUNNER_TEMP/gg.pim.jetstream.streamDeckPlugin" \
            --repo "$GITHUB_REPOSITORY" --clobber
